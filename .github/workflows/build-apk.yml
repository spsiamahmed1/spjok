name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: কোড নামানো
        uses: actions/checkout@v7

      - name: Java 17 সেটআপ
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK license গ্রহণ
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager_path"
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdkmanager_path" --sdk_root="$ANDROID_HOME" --licenses

      - name: Android SDK Platform ইনস্টল
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: APK তৈরি
        run: ./gradlew --no-daemon assembleDebug

      - name: APK Artifact আপলোড
        uses: actions/upload-artifact@v4
        with:
          name: ten-hour-challenge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
