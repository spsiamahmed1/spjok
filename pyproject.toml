[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spjok"
version = "0.1.0"
description = "A tiny Python command-line starter project"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "spjok contributors" }]

[project.scripts]
spjok = "spjok.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
